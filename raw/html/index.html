<script type="text/javascript">

function getCookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for(var i = 0; i <ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
        }
    }
    return "";
}
function ChangeLanguage(){
	var language = document.getElementById("language").value; 
	if (language=="3"){
		document.getElementById("lblAppName").innerHTML="CREDIT RATING SYSTEM";
		document.getElementById("appfooter").innerHTML="© 2017 Vietnam - Russia Joint Venture Bank"; 
		
		
	}
	else {
		document.getElementById("lblAppName").innerHTML="CHƯƠNG TRÌNH XẾP HẠNG TÍN DỤNG";
		document.getElementById("appfooter").innerHTML="©2017 - Ngân hàng Liên doanh Việt - Nga."; 
		
		
		
	}
	 
}

function setCookie(cname, cvalue, exdays) {
    var d = new Date();
    d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
    var expires = "expires="+d.toUTCString();
    document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
}
function DecryptPassword(){
	
	var pass = document.getElementById("password").value;
	var user = document.getElementById("userName").value;
	
	if (user==''){
		alert("Username is required!");
		return false;
	}
	if (pass==''){
		alert("Password is required!");
		return false;
	}
	var language = document.getElementById("language").value;
	if (language=="1"){
		alert("Language is required!");
		return false;
	}
	
	document.getElementById("abc").value = pass;
	var abcPass = document.getElementById("abc").value;
	var newPass = abcPass + "_" + user;	
	document.getElementById("password").value = md5(newPass);

}
